<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
</head>
<body style="font-family:'Calibri','Carlito',sans-serif; font-size:10pt; color:#1F2937; line-height:1.4;">

<template id="background">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#F5F3FF"/>
    <path d="M0,14 C14,4 36,2 55,10 C74,18 89,18 100,10 L100,0 L0,0 Z" fill="#EDE9FE"/>
    <path d="M0,100 L0,72 C18,66 39,67 56,76 C74,86 88,89 100,83 L100,100 Z" fill="#DDD6FE"/>
    <circle cx="83" cy="20" r="11" fill="#A78BFA"/>
    <circle cx="18" cy="82" r="8" fill="#DDD6FE"/>
    <path d="M12,26 C29,15 51,15 72,24 C80,27 88,27 95,24" fill="none" stroke="#5B21B6" stroke-width="1.2" stroke-linecap="round" opacity="0.65"/>
    <path d="M8,62 C24,54 42,55 58,63 C72,70 86,71 96,66" fill="none" stroke="#5B21B6" stroke-width="1.1" stroke-linecap="round" opacity="0.45"/>
  </svg>
</template>

<table width="100%" cellspacing="0" cellpadding="0">
  <tr><td style="padding:14px 16px;"><div style="font-size:18pt; font-weight:bold; color:#334155;">{{ folder_title }}</div><div style="font-size:9pt; color:#4B5563;">{{ company_name }} &middot; {{ department_name }}</div></td></tr>
</table>
<table width="100%" cellspacing="0" cellpadding="0"><tr><td style="background-color:#94A3B8; padding:2px; font-size:1pt;">&nbsp;</td></tr></table>

<p style="padding:10px 14px;">{{ folder_description }}</p>

<table width="100%" cellspacing="0" cellpadding="0" border="1">
  <tr style="background-color:#E2E8F0;"><th width="28%" style="padding:6px 8px; color:#334155; text-align:left;">Document</th><th width="22%" style="padding:6px 8px; color:#334155; text-align:left;">Code</th><th width="50%" style="padding:6px 8px; color:#334155; text-align:left;">Purpose</th></tr>
  <tr style="background-color:#F8FAFC;"><td style="padding:6px 8px;">{{ document_name }}</td><td style="padding:6px 8px;">{{ document_code }}</td><td style="padding:6px 8px;">{{ document_purpose }}</td></tr>
  <tr><td style="padding:6px 8px;">{{ document_name }}</td><td style="padding:6px 8px;">{{ document_code }}</td><td style="padding:6px 8px;">{{ document_purpose }}</td></tr>
</table>

<table width="100%" cellspacing="0" cellpadding="0" border="0">
  <tr style="background-color:#F8FAFC;">
    <td width="50%" style="padding:8px 12px;"><div style="font-size:8pt; color:#6B7280;">Owner</div><div style="font-weight:bold;">{{ folder_owner }}</div></td>
    <td width="50%" style="padding:8px 12px;"><div style="font-size:8pt; color:#6B7280;">Revision Date</div><div style="font-weight:bold;">{{ revision_date }}</div></td>
  </tr>
</table>

</body>
</html>
